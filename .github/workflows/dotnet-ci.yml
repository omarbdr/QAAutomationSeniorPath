name: .NET CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore "OmarBeltrandelRioMendez.sln"
      
    - name: Build
      run: dotnet build "OmarBeltrandelRioMendez.sln" --configuration Release --no-restore
      
    - name: Test
      run: dotnet test "OmarBeltrandelRioMendez.sln" --configuration Release --no-build --verbosity normal